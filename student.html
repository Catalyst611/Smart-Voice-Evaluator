<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生练习系统</title>
    <style>
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; background: #f5f7f9; }
        #start-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
        .sidebar { width: 250px; background: #2c3e50; color: white; padding: 20px; overflow-y: auto; }
        .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card { background: white; width: 85%; max-width: 700px; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .q-item { padding: 15px; border-bottom: 1px solid #34495e; cursor: pointer; transition: 0.2s; }
        .active { background: #3498db; }
        .btn-rec { width: 140px; height: 140px; border-radius: 50%; border: none; background: #e74c3c; color: white; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s;}
        .recording { animation: pulse 1.2s infinite; background: #c0392b; }
        #loading-msg, #cmd-msg { color: #3498db; font-weight: bold; margin: 15px 0; display: none; }
        .score-num { font-size: 64px; font-weight: bold; transition: color 0.3s;}
        
        /* 红绿比对框样式 */
        .diff-box { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: left; font-size: 18px; line-height: 1.8; border: 1px solid #ddd;}
        .diff-title { font-size: 14px; color: #888; margin-bottom: 5px; font-weight: bold; }
        
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 20px rgba(231, 76, 60, 0.6); } 50% { transform: scale(1.1); box-shadow: 0 0 40px rgba(231, 76, 60, 0.8);} 100% { transform: scale(1); box-shadow: 0 0 20px rgba(231, 76, 60, 0.6); } }
    </style>
</head>
<body>
<div id="start-overlay">
    <h1>智能口语练习系统</h1>
    <button onclick="startSystem()" style="padding: 15px 40px; font-size: 20px; cursor: pointer; border-radius: 30px; border: none; background: #2ecc71; color: white;">点击开始作业</button>
</div>

<div class="sidebar">
    <h3 id="assign-name" style="text-align: center; border-bottom: 1px solid #34495e; padding-bottom: 10px;">加载中...</h3>
    <div id="qList"></div>
</div>

<div class="main">
    <div style="margin-bottom: 20px; display: flex; justify-content: space-between; width: 85%; max-width: 700px;">
        <span style="font-weight: bold; color: #2c3e50;">当前登录: <span id="current-user" style="color:#3498db"></span></span>
        <button onclick="logout()" style="padding: 5px 15px; border:none; background:#e74c3c; color:white; border-radius:4px; cursor:pointer;">退出登录</button>
    </div>

    <div class="card" id="qCard" style="display:none;">
        <h2 id="qText" style="font-size: 28px; margin-bottom: 30px;"></h2>
        <button class="btn-rec" id="recBtn" onclick="manualToggleRec()">开始录音</button>
        <div id="loading-msg">正在评分，请稍后...</div>
        <div id="cmd-msg" style="color:#e67e22;">🎤 正在听取您的指令...</div>

        <div id="resArea" style="display:none;">
            <div class="score-num" id="score">0</div>
            
            <!-- 🌟 核心：红绿错题比对展示区 -->
            <div class="diff-box">
                <div class="diff-title">🎯 您的回答比对分析：</div>
                <div id="diffHtml"></div>
            </div>
            
            <div style="margin-top: 20px;">
                <button onclick="manualSel(curIdx)" style="padding: 10px 20px; cursor:pointer;">重新回答</button>
                <button id="nextBtn" onclick="manualNext()" style="padding: 10px 20px; background:#3498db; color:white; border:none; cursor:pointer;">下一题</button>
            </div>
        </div>
    </div>
</div>

<script>
    const API = window.location.origin;
    let qs = [], curIdx = 0, mediaRec, chunks =[], audioCtx, analyser, dataArr, silenceStart = null;
    let flowTimeout = null, currentAudio = null, recMode = 'ANSWER', currentAssign = null;

    const currentUsername = localStorage.getItem('username');
    if (!currentUsername || localStorage.getItem('role') !== 'student') { alert("请先以学生身份登录！"); window.location.href = 'login.html'; } 
    else { document.getElementById('current-user').innerText = currentUsername; }
    function logout() { localStorage.clear(); window.location.href = 'login.html'; }

    function interruptFlow() {
        if (flowTimeout) clearTimeout(flowTimeout);
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        window.speechSynthesis.cancel();
        if (mediaRec && mediaRec.state === "recording") { mediaRec.onstop = null; mediaRec.stop(); }
        document.getElementById('recBtn').classList.remove('recording');
        document.getElementById('cmd-msg').style.display = 'none';
    }

    async function startSystem() {
        document.getElementById('start-overlay').style.display = 'none';
        currentAssign = await (await fetch(`${API}/api/student/current_assignment?username=${currentUsername}`)).json();
        if (!currentAssign.id) { alert("老师还没有布置任何作业！"); document.getElementById('assign-name').innerText = "暂无作业"; return; }
        document.getElementById('assign-name').innerText = currentAssign.name;
        qs = await (await fetch(`${API}/api/questions?assignment_id=${currentAssign.id}`)).json();
        document.getElementById('qList').innerHTML = qs.map((q, i) => `<div class="q-item" id="i-${i}" onclick="manualSel(${i})">题目 ${i+1}</div>`).join('');
        const msg = new SpeechSynthesisUtterance(`欢迎，本次练习作业是：${currentAssign.name}。`);
        msg.lang = 'zh-CN'; msg.onend = () => { if(qs.length > 0) sel(0); }; window.speechSynthesis.speak(msg);
    }

    async function sel(i) {
        curIdx = i; document.querySelectorAll('.q-item').forEach(e => e.classList.remove('active')); document.getElementById(`i-${i}`).classList.add('active');
        document.getElementById('qCard').style.display = 'block'; document.getElementById('qText').innerText = qs[i].text;
        document.getElementById('resArea').style.display = 'none';
        let btn = document.getElementById('recBtn'); btn.style.display = 'inline-block'; btn.innerText = "播放中..."; btn.disabled = true;
        document.getElementById('nextBtn').style.display = (i < qs.length-1) ? 'inline-block' : 'none';
        playQuestionAudio(qs[i].text, qs[i].lang);
    }
    function manualSel(i) { interruptFlow(); sel(i); }
    function manualNext() { interruptFlow(); if(curIdx < qs.length-1) sel(curIdx + 1); }
   function manualToggleRec() {
        // 如果当前正在录音，点击按钮则纯粹停止录音
        if (mediaRec && mediaRec.state === "recording") {
            mediaRec.stop();
            return;
        }
        // 否则，打断其它发音流程，开启录音
        interruptFlow(); 
        toggleRec('ANSWER'); 
    }
    async function playQuestionAudio(text, lang) {
        try {
            const res = await fetch(`${API}/synthesize_question`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text, language: lang}) });
            currentAudio = new Audio(URL.createObjectURL(await res.blob()));
            currentAudio.onended = () => { document.getElementById('recBtn').innerText = "准备录音"; flowTimeout = setTimeout(() => toggleRec('ANSWER'), 1000); };
            currentAudio.play();
        } catch(e) { document.getElementById('recBtn').disabled = false; }
    }

    function checkVAD() {
        if(!mediaRec || mediaRec.state !== "recording") return;
        analyser.getByteFrequencyData(dataArr);
        let avg = dataArr.reduce((a,b)=>a+b, 0)/dataArr.length;
        // 🌟 把 15 改为 35 (数值越大，抗背景杂音能力越强，更容易判定停顿)
        if(avg < 35) { 
            if(!silenceStart) silenceStart = Date.now(); 
            if(Date.now() - silenceStart > 2000) { mediaRec.stop(); return; } 
        } else silenceStart = null;
        requestAnimationFrame(checkVAD);
    }

    async function toggleRec(mode = 'ANSWER') {
        recMode = mode;
        try{
            if(!mediaRec || mediaRec.state === "inactive") {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRec = new MediaRecorder(stream); chunks =[];
                mediaRec.ondataavailable = e => chunks.push(e.data);
                mediaRec.onstop = (mode === 'ANSWER') ? uploadAnswer : uploadCommand;
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const src = audioCtx.createMediaStreamSource(stream); analyser = audioCtx.createAnalyser(); src.connect(analyser); dataArr = new Uint8Array(analyser.frequencyBinCount);
                mediaRec.start(); silenceStart = null; checkVAD();
                let btn = document.getElementById('recBtn'); btn.disabled = false; btn.classList.add('recording');
                btn.innerHTML = mode === 'ANSWER' ? `正在录音<br><span style="font-size:12px; font-weight:normal;">(停顿2秒自动停止)</span>` : `请说指令`;
            } else mediaRec.stop();
        } catch(err) {
            alert("无法打开麦克风！请确保网址是 https 开头，并在浏览器设置中允许麦克风权限！");
            document.getElementById('recBtn').disabled = false;
            document.getElementById('recBtn').innerText = "点击重试录音";
        }
    }

    async function uploadAnswer() {
        document.getElementById('recBtn').classList.remove('recording'); document.getElementById('recBtn').style.display = 'none'; document.getElementById('loading-msg').style.display = 'block';
        window.speechSynthesis.cancel(); const loadVoice = new SpeechSynthesisUtterance("正在评分，请稍后"); loadVoice.lang = 'zh-CN'; window.speechSynthesis.speak(loadVoice);

        const fd = new FormData(); fd.append('user_audio', new Blob(chunks)); fd.append('standard_answer', qs[curIdx].answer); fd.append('language', qs[curIdx].lang); fd.append('student_id', currentUsername); fd.append('question_id', qs[curIdx].id); 
        const d = await (await fetch(`${API}/recognize_and_evaluate`, { method: 'POST', body: fd })).json();
        
        document.getElementById('loading-msg').style.display = 'none'; document.getElementById('resArea').style.display = 'block';
        document.getElementById('score').innerText = d.score; document.getElementById('score').style.color = d.is_passed ? "#2ecc71" : "#e74c3c";
        
        // 🌟 注入红绿比对 HTML
        document.getElementById('diffHtml').innerHTML = d.diff_html;
        
        window.speechSynthesis.cancel();
        let promptText = ""; const isLast = (curIdx === qs.length - 1);
        if(d.is_passed) promptText = `得分：${d.score}分。恭喜你达标！` + (isLast ? `这也是最后一题了，是否结束？` : `是否进入下一题？`);
        else promptText = `得分：${d.score}分。未达标，` + (isLast ? `最后一题了，是否重新回答？` : `请问是否重新回答？`);

        const msg = new SpeechSynthesisUtterance(promptText); msg.lang = 'zh-CN';
        msg.onend = () => { document.getElementById('cmd-msg').style.display = 'block'; flowTimeout = setTimeout(() => toggleRec('COMMAND'), 500); };
        window.speechSynthesis.speak(msg);
    }

    async function uploadCommand() {
        document.getElementById('cmd-msg').innerText = "正在识别指令..."; document.getElementById('recBtn').classList.remove('recording');
        const fd = new FormData(); fd.append('user_audio', new Blob(chunks));
        try {
            const txt = (await (await fetch(`${API}/api/recognize_command`, { method: 'POST', body: fd })).json()).text || "";
            document.getElementById('cmd-msg').style.display = 'none'; document.getElementById('cmd-msg').innerText = "🎤 正在听取您的指令..."; 
            const isLast = (curIdx === qs.length - 1);
            const wantReanswer = (txt.includes("重新") || txt.includes("再来")) && !txt.includes("不") && !txt.includes("没");
            const wantNext = (txt.includes("下") || txt.includes("结束")) && !txt.includes("不") && !txt.includes("没");
            window.speechSynthesis.cancel(); 

            if (wantReanswer) { sel(curIdx); } 
            else if (wantNext) {
                if (!isLast) sel(curIdx + 1);
                else {
                    const quitMsg = new SpeechSynthesisUtterance("练习结束，感谢使用。"); quitMsg.lang = 'zh-CN'; window.speechSynthesis.speak(quitMsg);
                    document.getElementById('cmd-msg').style.display = 'block'; document.getElementById('cmd-msg').innerText = "🎉 练习已结束。"; document.getElementById('cmd-msg').style.color = "#2ecc71"; document.getElementById('recBtn').style.display = 'none'; 
                }
            } else {
                if (isLast) {
                    const endMsg = new SpeechSynthesisUtterance("最后了，重新回答或结束？"); endMsg.lang = 'zh-CN';
                    endMsg.onend = () => { document.getElementById('cmd-msg').style.display = 'block'; flowTimeout = setTimeout(() => toggleRec('COMMAND'), 500); }; window.speechSynthesis.speak(endMsg);
                } else {
                    const repromptMsg = new SpeechSynthesisUtterance("没听清。重新回答，还是下一题？"); repromptMsg.lang = 'zh-CN';
                    repromptMsg.onend = () => { document.getElementById('cmd-msg').style.display = 'block'; flowTimeout = setTimeout(() => toggleRec('COMMAND'), 500); }; window.speechSynthesis.speak(repromptMsg);
                }
            }
        } catch (e) { document.getElementById('recBtn').style.display = 'inline-block'; document.getElementById('recBtn').innerText = "网络错误，重新录音"; }
    }
</script>
</body>
</html>
